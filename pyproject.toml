[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prvr-agent"
version = "0.1.1"
description = "Peak-seeded support-refute agentic reranking for partially relevant video retrieval."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.24",
  "pydantic>=2.6",
]

[project.optional-dependencies]
torch = ["torch>=2.0"]
video = ["decord>=0.6", "Pillow>=10.0"]
llm = ["openai>=1.40"]
dev = ["pytest>=8.0"]
all = [
  "torch>=2.0",
  "decord>=0.6",
  "Pillow>=10.0",
  "openai>=1.40",
  "pytest>=8.0",
]

[project.scripts]
prvr-agent = "prvr_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"
